<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <title>Capture Recherche Immo IA</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f3f4f6, #0b0f19);
      --surface: light-dark(#ffffff, #111827);
      --border: light-dark(#9ca3af, #3b4b68);
      --ink: light-dark(#0f172a, #f8fafc);
      --ink-muted: light-dark(#475569, #94a3b8);
      --accent: light-dark(#1d4ed8, #60a5fa);
      --accent-hover: light-dark(#1e40af, #93c5fd);
      --accent-contrast: light-dark(#ffffff, #090d16);
    }
    body {
      width: 350px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 16px;
      margin: 0;
      font-variant-numeric: tabular-nums;
    }
    h1 { margin: 0 0 10px 0; font-size: 18px; font-weight: 750; color: var(--accent); }
    label { display: block; font-size: 12px; color: var(--ink); margin-top: 9px; margin-bottom: 3px; font-weight: 650; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 7px 9px;
      border-radius: 6px;
      font-size: 13px;
    }
    ::placeholder { color: var(--ink-muted); opacity: 1; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      margin-top: 14px;
      width: 100%;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--accent-contrast);
      font-weight: 700;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13.5px;
    }
    button:hover { background: var(--accent-hover); }
    #statusMsg { margin-top: 8px; font-size: 12px; text-align: center; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Capture vers Recherche Immo IA</h1>
  <label for="serverUrl">Serveur Recherche Immo (Beelink)</label>
  <input type="text" id="serverUrl" value="http://localhost:8765" />

  <label for="addressInput">Adresse exacte du bien (ou Rue + Ville) *</label>
  <input type="text" id="addressInput" placeholder="Ex: 15 rue Jeanne d'Arc, 76000 Rouen" />

  <div class="row">
    <div>
      <label for="priceInput">Prix (€)</label>
      <input type="number" id="priceInput" />
    </div>
    <div>
      <label for="typeInput">Type</label>
      <select id="typeInput">
        <option value="Maison">Maison</option>
        <option value="Appartement">Appartement</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="surfaceInput">Surface (m²)</label>
      <input type="number" id="surfaceInput" />
    </div>
    <div>
      <label for="landInput">Terrain (m²)</label>
      <input type="number" id="landInput" />
    </div>
  </div>

  <div class="row">
    <div>
      <label for="bedroomsInput">Chambres</label>
      <input type="number" id="bedroomsInput" />
    </div>
    <div>
      <label for="dpeInput">DPE</label>
      <input type="text" id="dpeInput" maxlength="1" placeholder="A-G" />
    </div>
  </div>

  <label for="titleInput">Titre de l'annonce</label>
  <input type="text" id="titleInput" />

  <div id="photoStatus" style="font-size: 12px; margin-top: 10px; color: var(--ink-muted); font-weight: 600;">
    📷 Recherche des photos...
  </div>

  <button id="btnSend">Envoyer &amp; Analyser en 1 Clic</button>
  <div id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
